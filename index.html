<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7a33">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="দাশেরহাট স্কুল">
<title>দাশেরহাট উচ্চ বিদ্যালয়</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1b2340;--mut:#5d6785;--line:#e1e5f0;--pri:#0e7a33;--onpri:#fff;--ok:#0f7b5f;--okbg:#e2f5ee;--bad:#b42318;--badbg:#fdeceb;--hi:#fff4d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1426;--card:#18203a;--ink:#e8ecf8;--mut:#9aa5c6;--line:#2a3354;--pri:#5fd38a;--onpri:#0b2a14;--ok:#4fd1a5;--okbg:#12342b;--bad:#ff8a7e;--badbg:#3a1a18;--hi:#3a3216}}
:root[data-theme="dark"]{--bg:#0f1426;--card:#18203a;--ink:#e8ecf8;--mut:#9aa5c6;--line:#2a3354;--pri:#5fd38a;--onpri:#0b2a14;--ok:#4fd1a5;--okbg:#12342b;--bad:#ff8a7e;--badbg:#3a1a18;--hi:#3a3216}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;font-size:17px;line-height:1.55}
body{max-width:560px;margin:0 auto;padding-bottom:84px}
header{background:var(--pri);color:var(--onpri);padding:14px 16px;display:flex;align-items:center;gap:12px}
header img{width:56px;height:56px;border-radius:50%;background:#fff;flex:none}
.hero{width:100%;height:auto;border-radius:10px;display:block;margin-bottom:12px;border:1px solid var(--line)}
header h1{margin:0;font-size:22px;font-weight:700}
header p{margin:2px 0 0;font-size:14px;opacity:.85}
main{padding:14px}
h2{font-size:19px;margin:6px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.card b{font-weight:600}
.mut{color:var(--mut);font-size:14px}
.pin{border-left:4px solid var(--pri);background:var(--hi)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:10px 2px 9px;font:inherit;font-size:14px;color:var(--mut);cursor:pointer}
nav button .i{display:block;font-size:20px;line-height:1.1}
nav button[aria-current="true"]{color:var(--pri);font-weight:700;box-shadow:inset 0 3px 0 var(--pri)}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin:4px 0 8px}
button.b{font:inherit;font-weight:600;background:var(--pri);color:var(--onpri);border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
button.g{font:inherit;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.sw{display:flex;gap:6px}
.sw button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--mut);border-radius:8px;padding:5px 12px;cursor:pointer}
.sw .p.on{background:var(--okbg);color:var(--ok);border-color:var(--ok);font-weight:700}
.sw .a.on{background:var(--badbg);color:var(--bad);border-color:var(--bad);font-weight:700}
.sum{display:flex;gap:8px;margin:8px 0 12px}
.sum div{flex:1;text-align:center;border-radius:10px;padding:8px;background:var(--card);border:1px solid var(--line)}
.sum strong{display:block;font-size:24px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:15px}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:left}
th{background:var(--bg);font-weight:600}
.gr{font-size:34px;font-weight:700;color:var(--ok)}
.empty{text-align:center;color:var(--mut);padding:24px 10px}
.lock{font-size:13px;margin-top:18px;text-align:center}
.lock button{background:none;border:0;color:var(--pri);font:inherit;text-decoration:underline;cursor:pointer}
.msg .who{display:flex;gap:12px;align-items:center;margin-bottom:8px}.msg .who img{width:68px;height:68px;border-radius:50%;object-fit:cover;object-position:50% 20%;flex:none;border:2px solid var(--pri)}.msg .mt{white-space:pre-line;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}.msg .mt.open{display:block}
.tick{display:flex;align-items:stretch;background:var(--hi);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}.tick .tl{flex:none;background:var(--bad);color:#fff;font-weight:700;font-size:14px;padding:8px 12px;display:flex;align-items:center}.tick .tv{flex:1;overflow:hidden;white-space:nowrap;padding:8px 0;position:relative;min-height:40px}.tick .tt{display:inline-block;padding-left:100%;animation:tk 20s linear infinite;will-change:transform}.tick .tv:hover .tt,.tick .tv:active .tt{animation-play-state:paused}@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-100%)}}@media (prefers-reduced-motion:reduce){.tick .tt{animation:none;padding-left:8px;white-space:normal;display:block}.tick .tv{white-space:normal}}
.ss{position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;margin-bottom:12px;background:var(--line)}.sl{position:absolute;inset:0;opacity:0;transition:opacity .8s}.sl.on{opacity:1}.sl img{width:100%;height:100%;object-fit:cover;display:block}.cp{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 12px;color:#fff;font-weight:700;font-size:19px;background:linear-gradient(transparent,rgba(0,0,0,.72))}.dt{position:absolute;right:10px;bottom:14px;display:flex;gap:6px}.dt button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.5);cursor:pointer}.dt button.on{background:#fff;width:22px;border-radius:6px}@media (prefers-reduced-motion:reduce){.sl{transition:none}}
.tc{display:flex;gap:12px;align-items:center}.tc img,.av{width:60px;height:60px;border-radius:50%;flex:none;object-fit:cover;object-position:50% 20%;border:2px solid var(--pri)}.av{display:flex;align-items:center;justify-content:center;background:var(--okbg);color:var(--ok);font-size:24px;font-weight:700}.tc a{color:var(--pri)}.tc .x{margin-left:auto}
nav button{font-size:12.5px;line-height:1.25;padding:9px 2px 8px}.seg{display:flex;gap:8px;margin-bottom:12px}.seg button{flex:1;font:inherit;font-weight:600;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer}.seg button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gi{position:relative;padding:0;border:0;border-radius:10px;overflow:hidden;aspect-ratio:4/3;cursor:pointer;background:var(--line)}.gi img{width:100%;height:100%;object-fit:cover;display:block}.gi span{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 7px;color:#fff;font-weight:600;font-size:14px;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.72))}.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}.lb img{max-width:100%;max-height:75vh;border-radius:8px}.lb div{color:#fff;font-weight:700;font-size:18px}.lb button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;font:inherit;font-size:16px;background:#fff;color:#000;border:0;border-radius:8px;padding:6px 14px;cursor:pointer}
nav{overflow-x:auto}nav button{flex:1 0 auto;min-width:70px}
.seg{flex-wrap:wrap}.seg button{flex:1 0 auto;padding:8px 10px}label.mut{display:block}
.sh{font-size:17px;margin:18px 0 8px;color:var(--pri)}.irow{padding:7px 0;border-bottom:1px solid var(--line)}.irow:last-child{border:0}.irow b{text-align:right}.card a{color:var(--pri)}a.b{font-weight:600;background:var(--pri);color:var(--onpri)!important;border-radius:8px;padding:10px 14px;display:inline-block;text-decoration:none;margin:0 6px 6px 0}
.cat{margin:16px 0 8px;font-weight:700;color:var(--pri)}.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{font:inherit;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 4px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}.ic{width:46px;height:46px;border-radius:12px;background:var(--okbg);display:flex;align-items:center;justify-content:center;font-size:24px}
#sp{position:fixed;inset:0;z-index:100;background:var(--pri);color:var(--onpri);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .5s;text-align:center}#sp img{border-radius:50%;background:#fff}#sp.hide{opacity:0;pointer-events:none}.card ol{margin:6px 0 0;padding-left:22px}
</style>
</head>

মাধ্যমে বিদ্যালয়ের শিক্ষা কার্যক্রম, নোটিশ, ফলাফল, বিভিন্ন কর্মসূচি ও প্রাতিষ্ঠানিক তথ্য শিক্ষক, শিক্ষার্থী, অভিভাবক এবং সংশ্লিষ্ট সকলের কাছে সহজে পৌঁছে দেওয়া সম্ভব হবে।\n\nআমি আশা করি, আমাদের এই ডিজিটাল উদ্যোগ বিদ্যালয়ের সার্বিক কার্যক্রমকে আরও গতিশীল, স্বচ্ছ ও আধুনিক করে তুলবে। একই সঙ্গে শিক্ষার্থীদের তথ্যপ্রযুক্তির প্রতি আগ্রহী করে তাদের ভবিষ্যৎ জীবনের জন্য প্রস্তুত হতে সহায়তা করবে। দাশেরহাট উচ্চ বিদ্যালয়ের উত্তরোত্তর সাফল্য, সমৃদ্ধি ও সুনাম কামনা করছি।\n\nবিদ্যালয়ের সকল শিক্ষক, শিক্ষার্থী, অভিভাবক, প্রাক্তন শিক্ষার্থী ও শুভানুধ্যায়ীদের আন্তরিক সহযোগিতা আমাদের পথচলাকে আরও সুন্দর ও সফল করবে—এই প্রত্যাশা রাখি। শুভ হোক আমাদের জ্ঞান ও প্রযুক্তিনির্ভর পথচলা।"}];
